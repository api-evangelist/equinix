      operationId: getStreamsAssets
      parameters:
      - name: offset
        in: query
        description: offset
        required: false
        schema:
          type: integer
        example: 1
      - name: limit
        in: query
        description: number of records to fetch
        required: false
        schema:
          type: integer
        example: 10
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamAssetSearchRequest'
            examples:
