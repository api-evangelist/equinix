                $ref: '#/components/examples/StreamAssetSearchRequestExample'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllStreamAssetResponse'
              examples:
